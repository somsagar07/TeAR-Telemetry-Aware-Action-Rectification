name: CPU tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: pip install "torch>=2.2,<2.6" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-test.txt
      - run: python -m pytest -q
      - run: python -m experiments.mismatch.make_manifest --help && python -m experiments.mismatch.run --help
